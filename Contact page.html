<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="Home.html" class="logo">
            <img src="Images/Revive ThriftCo. Logo.png" alt="Revive Thrift Co. logo">
        </a>
        <ul class="nav-links">
            <li><a href="Home.html">Home</a></li>
            <li><a href="About_page.html">About</a></li>
            <li><a href="Home.html#shop">Shop</a></li>
            <li><a href="Location page.html">Location</a></li>
            <li><a href="Contact page.html">Contact</a></li>
        </ul>
    </header>

    <!-- Main Content -->
    <main class="contact-container">
        <h1>Get in Touch</h1>
        <p>Have questions about stock, sizing, or orders? Drop us a line below.</p>

        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="071 234 5678">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required placeholder="Order inquiry, stock question, etc.">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </main>

    <!-- Contact Page Gallery -->
    <section class="section section-alt">
        <h2>Find Us In Store</h2>
        <div class="catalogue-grid">
            <div class="catalogue-item">
                <img src="Images/Picture 2.jpeg" alt="Inside Revive Thrift Co.">
            </div>
            <div class="catalogue-item">
                <img src="Images/Picture 4.jpeg" alt="Revive Thrift Co. rack">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Revive Thrift Co. All rights reserved. ST10519854.</p>
    </footer>

</body>
</html>
