    <!-- Main Content -->
    <main class="contact-container">
        <h1>Enquire About Stock</h1>
        <p>Ask about availability, sizing, or a custom request — we'll get back to you with the details.</p>

        <!-- Submitted with fetch() in script.js — no page reload -->
        <form id="enquiry-form" novalidate>
            <!-- Honeypot: hidden from people, catches bots -->
            <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="form-group">
                <label for="enq-name">Name</label>
                <input type="text" id="enq-name" name="name" placeholder="Your full name">
                <span class="error-text" id="enq-name-error"></span>
            </div>

            <div class="form-group">
                <label for="enq-email">Email Address</label>
                <input type="email" id="enq-email" name="email" placeholder="your.email@example.com">
                <span class="error-text" id="enq-email-error"></span>
            </div>

            <div class="form-group">
                <label for="enq-type">Enquiry Type</label>
                <select id="enq-type" name="enquiryType">
                    <option value="">Select an option</option>
                    <option value="availability">Product Availability</option>
                    <option value="sizing">Sizing & Fit</option>
                    <option value="custom">Custom Request</option>
                    <option value="bulk">Bulk / Wholesale Order</option>
                </select>
                <span class="error-text" id="enq-type-error"></span>
            </div>

            <div class="form-group">
                <label for="enq-item">Item or Category</label>
                <input type="text" id="enq-item" name="item" placeholder="e.g. Vintage denim jacket, size M">
                <span class="error-text" id="enq-item-error"></span>
            </div>

            <div class="form-group">
                <label for="enq-message">Message</label>
                <textarea id="enq-message" name="message" placeholder="Any extra detail we should know?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Enquiry</button>
        </form>

        <div id="enquiry-response" class="form-response" role="status" aria-live="polite" hidden></div>
    </main>
